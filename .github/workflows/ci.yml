name: CI

# Runs on every pull request, and is called by the Pages workflow so a commit
# on main is deployed only after it passes the same checks.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what
      # runs; Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only runtime dependencies end up on the site. Dev tooling is left to
      # Dependabot rather than blocking every deploy.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Runs the tests and enforces the coverage thresholds in vite.config.ts.
      - run: npm run coverage
      - run: npm run build
